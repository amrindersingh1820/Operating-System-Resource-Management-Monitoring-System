# ==============================================================================
# System Configuration Placeholder
# Operating System Resource Management & Monitoring System
# ==============================================================================

[system]
# Simulation tick rate in milliseconds
tick_rate_ms = 100
log_level = INFO

[cpu]
# CPU simulation settings
default_quantum = 2
default_algorithm = FCFS

[memory]
# Simulated physical memory limits
total_memory_kb = 4096
allocation_strategy = FIRST_FIT

[deadlock]
# Deadlock avoidance / detection settings
banker_enabled = 1
detection_interval_ticks = 5
